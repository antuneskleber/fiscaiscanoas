<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Consulta · Fiscais PT Canoas</title>
<meta name="theme-color" content="#C4161C">
<style>
  :root { --red: #C4161C; --bg: #f6f3f2; --card: #fff; --ink: #1d1b1b; --muted: #6b6464; --line: #e3dcda; --ok: #17803d; --warn: #b26a00; --wa: #1fa855; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--red); color: #fff; padding: calc(16px + env(safe-area-inset-top)) 16px 16px; }
  header .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 900px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 1.2rem; }
  header p { margin: 4px auto 0; max-width: 900px; opacity: .9; font-size: .92rem; }
  header button { background: transparent; border: 1px solid rgba(255,255,255,.6); color: #fff; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  main { max-width: 900px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
  .sticky { position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 2; }
  .search { position: relative; }
  input, select { font: inherit; font-size: 16px; padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); width: 100%; }
  input:focus { outline: none; border-color: var(--red); }
  .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: var(--line); border-radius: 50%; width: 28px; height: 28px; cursor: pointer; display: none; }
  .tabs { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
  .tabs button { flex: none; font: inherit; font-size: .9rem; padding: 8px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .meta { color: var(--muted); font-size: .9rem; margin: 6px 0 12px; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; box-shadow: 0 4px 16px rgba(60,20,20,.06); margin-bottom: 12px; }
  .ct { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .ct h2 { margin: 0; font-size: 1rem; }
  .zona { flex: none; background: #fdecea; color: var(--red); font-weight: 700; font-size: .8rem; padding: 3px 9px; border-radius: 999px; }
  .addr { color: var(--muted); font-size: .9rem; margin: 4px 0 10px; }
  .addr a { color: inherit; }
  .secs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
  .secs span { font-size: .78rem; font-variant-numeric: tabular-nums; padding: 2px 7px; border-radius: 6px; background: #f1edec; color: var(--muted); }
  .secs span.on { background: #e3f4e8; color: var(--ok); font-weight: 600; }
  .secs span.hit { background: var(--red); color: #fff; font-weight: 700; }
  .status { font-size: .85rem; font-weight: 600; margin-bottom: 6px; }
  .status.ok { color: var(--ok); } .status.zero { color: var(--warn); }
  .fiscal { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 0; border-top: 1px solid var(--line); }
  .fiscal .n { font-weight: 600; }
  .fiscal .s { color: var(--muted); font-size: .85rem; }
  .acts { display: flex; gap: 6px; }
  .acts a { text-decoration: none; font-size: .88rem; font-weight: 600; padding: 7px 11px; border-radius: 9px; border: 1.5px solid var(--line); color: var(--ink); white-space: nowrap; }
  .acts a.wa { background: var(--wa); border-color: var(--wa); color: #fff; }
  .empty { text-align: center; color: var(--muted); padding: 30px; }
  #login { max-width: 380px; margin: 50px auto; }
  #login p { color: var(--muted); }
  .p { width: 100%; background: var(--red); color: #fff; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 700; cursor: pointer; margin-top: 10px; }
  .err { color: var(--red); margin-top: 8px; min-height: 1.2em; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>★ Locais e Fiscais · PT Canoas</h1><button id="sair" hidden>Sair</button></div>
  <p>2º turno · domingo, 25/10/2026</p>
</header>

<main>
  <section class="card" id="login">
    <h2 style="margin-top:0">Consulta restrita</h2>
    <p>Informe a chave de consulta enviada pela coordenação.</p>
    <form id="loginForm"><input id="chave" type="password" autocomplete="current-password" placeholder="Chave de consulta"><button class="p">Entrar</button></form>
    <div class="err" id="loginErr"></div>
  </section>

  <div id="app" hidden>
    <div class="sticky">
      <div class="search">
        <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Buscar local, bairro, seção ou nome do fiscal…">
        <button class="clear" id="limpar" type="button" aria-label="Limpar busca">✕</button>
      </div>
      <div class="tabs" id="tabs">
        <button data-f="todos" aria-pressed="true">Todos (<span id="cTodos">0</span>)</button>
        <button data-f="com" aria-pressed="false">✓ Com fiscal (<span id="cCom">0</span>)</button>
        <button data-f="sem" aria-pressed="false">⚠️ Sem fiscal (<span id="cSem">0</span>)</button>
        <button data-f="66" aria-pressed="false">Zona 66</button>
        <button data-f="134" aria-pressed="false">Zona 134</button>
      </div>
    </div>
    <p class="meta" id="meta" aria-live="polite"></p>
    <section id="lista" aria-live="polite"></section>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = v => String(v ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const telFmt = t => { const d = String(t).replace(/^55/, ""); return d.length === 11 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}` : `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; };
let chave = "";
try { chave = sessionStorage.getItem("fiscais_chave") || ""; } catch {}
let locais = [], filtro = "todos";

async function carregar() {
  const [rf, rl] = await Promise.all([
    fetch("/api/admin/fiscais", { headers: { authorization: `Bearer ${chave}` } }),
    fetch("/api/locais"),
  ]);
  if (rf.status === 401) { sair(); $("#loginErr").textContent = "Chave inválida."; return; }
  const fiscais = await rf.json();
  locais = (await rl.json()).locais.map(l => ({
    ...l,
    fiscais: fiscais.filter(f => f.zona === l.zona && f.local_id === l.id).sort((a, b) => (a.secao ?? 1e9) - (b.secao ?? 1e9)),
  }));
  locais.forEach(l => { l.busca = norm(`${l.nome} ${l.bairro} ${l.endereco} zona ${l.zona} ${l.fiscais.map(f => `${f.nome} ${f.telefone}`).join(" ")}`); });
  $("#cTodos").textContent = locais.length;
  $("#cCom").textContent = locais.filter(l => l.fiscais.length).length;
  $("#cSem").textContent = locais.filter(l => !l.fiscais.length).length;
  $("#login").hidden = true; $("#app").hidden = false; $("#sair").hidden = false;
  render();
}

function render() {
  const bruto = $("#q").value.trim();
  const q = norm(bruto);
  const secaoBusca = /^\d+$/.test(bruto) ? Number(bruto) : null;
  $("#limpar").style.display = bruto ? "block" : "none";

  const lista = locais.filter(l => {
    if (filtro === "com" && !l.fiscais.length) return false;
    if (filtro === "sem" && l.fiscais.length) return false;
    if ((filtro === "66" || filtro === "134") && l.zona !== Number(filtro)) return false;
    if (!q) return true;
    return secaoBusca !== null ? l.secoes.includes(secaoBusca) || l.busca.includes(q) : l.busca.includes(q);
  });

  const nSec = lista.reduce((n, l) => n + l.secoes.length, 0);
  const nFis = lista.reduce((n, l) => n + l.fiscais.length, 0);
  $("#meta").textContent = `${lista.length} local(is) · ${nSec} seções · ${nFis} fiscal(is)`;

  $("#lista").innerHTML = lista.length ? lista.map(l => {
    const ocupadas = new Set(l.fiscais.map(f => f.secao));
    const mapa = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${l.endereco}, ${l.bairro}, Canoas RS`)}`;
    return `<article class="card">
      <div class="ct"><h2>${esc(l.nome)}</h2><span class="zona">Zona ${l.zona}</span></div>
      <div class="addr">📍 <a href="${mapa}" target="_blank" rel="noopener">${esc(l.endereco)} · ${esc(l.bairro)}</a></div>
      <div class="secs">${l.secoes.map(s => `<span class="${s === secaoBusca ? "hit" : ocupadas.has(s) ? "on" : ""}">${s}</span>`).join("")}</div>
      <div class="status ${l.fiscais.length ? "ok" : "zero"}">${l.fiscais.length ? `✓ ${l.fiscais.length} fiscal(is) · ${[...ocupadas].filter(s => s != null).length}/${l.secoes.length} seções` : "⚠️ Sem fiscal"}</div>
      ${l.fiscais.map(f => `<div class="fiscal">
        <div><div class="n">${esc(f.nome)}</div><div class="s">${f.secao ? `Seção ${f.secao}` : "Volante (qualquer seção)"} · ${telFmt(f.telefone)}</div></div>
        <div class="acts"><a href="tel:+${f.telefone}">📞 Ligar</a><a class="wa" href="https://wa.me/${f.telefone}?text=${encodeURIComponent(`Olá ${f.nome.split(" ")[0]}, sou da coordenação dos fiscais do PT Canoas (${l.nome}).`)}" target="_blank" rel="noopener">WhatsApp</a></div>
      </div>`).join("")}
    </article>`;
  }).join("") : `<div class="empty">Nenhum local ou fiscal encontrado.</div>`;
}

function sair() { chave = ""; try { sessionStorage.removeItem("fiscais_chave"); } catch {} $("#app").hidden = true; $("#login").hidden = false; $("#sair").hidden = true; }

$("#loginForm").addEventListener("submit", e => {
  e.preventDefault(); chave = $("#chave").value.trim(); $("#loginErr").textContent = "";
  try { sessionStorage.setItem("fiscais_chave", chave); } catch {}
  carregar();
});
$("#sair").onclick = sair;
$("#q").addEventListener("input", render);
$("#limpar").onclick = () => { $("#q").value = ""; $("#q").focus(); render(); };
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  filtro = b.dataset.f; document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-pressed", x === b)); render();
});
if (chave) carregar();
</script>
</body>
</html>
