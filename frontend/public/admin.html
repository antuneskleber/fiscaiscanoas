<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173a67">
  <title>Cadastrar fiscal | Fiscais Canoas</title>
  <style>
    :root { --ink:#14223a; --muted:#536174; --paper:#fff; --canvas:#f3f6fa; --line:#d9e1ec; --brand:#173a67; --ok:#087443; --danger:#b3261e; } *{box-sizing:border-box} body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.wrap{max-width:640px;margin:auto;padding:max(24px,env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}.back{display:inline-flex;align-items:center;min-height:44px;color:var(--brand);font-weight:700;text-decoration:none}h1{margin:20px 0 6px;color:var(--brand);font-size:1.8rem}p{color:var(--muted)}form{margin-top:22px;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:0 2px 8px #14223a0a}label{display:block;margin:16px 0 6px;font-weight:700}input,select,button{width:100%;min-height:50px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}input:focus,select:focus{outline:3px solid #173a6720;border-color:var(--brand)}button{min-height:56px;margin-top:24px;border:0;background:var(--brand);color:#fff;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.hint{font-size:.85rem}.status{min-height:24px;margin-top:14px;font-weight:650}.success{color:var(--ok)}.error{color:var(--danger)}footer{margin-top:30px;color:var(--muted);font-size:.78rem;text-align:center}@media (max-width:600px){.wrap{padding-left:12px;padding-right:12px}h1{font-size:1.65rem}form{margin-top:18px;padding:18px}.back{min-height:48px}label{margin-top:18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="/">← Voltar à consulta</a>
    <h1>Cadastrar fiscal</h1>
    <p>Informe o local, a seção, o nome e o telefone. Os contatos permanecem restritos ao banco operacional.</p>
    <form id="form">
      <label for="location">Local</label>
      <input id="location" list="locations" autocomplete="off" required placeholder="Comece a digitar o nome do local">
      <datalist id="locations"></datalist>
      <label for="section">Seção</label>
      <select id="section" disabled><option>Escolha primeiro o local</option></select>
      <label for="name">Nome</label>
      <input id="name" autocomplete="name" required minlength="3" placeholder="Nome completo">
      <label for="phone">Telefone</label>
      <input id="phone" autocomplete="tel" inputmode="tel" placeholder="(51) 99999-9999">
      <label for="adminToken">Chave administrativa</label>
      <input id="adminToken" type="password" required autocomplete="off" placeholder="Informe a chave de edição">
      <button id="submit" type="submit">Salvar cadastro</button>
      <p id="status" class="status" aria-live="polite"></p>
    </form>
    <footer>Operação interna v0.3.3 • Developed by AK Labs</footer>
  </main>
  <script>
    const locationsInput = document.querySelector('#location');
    const locationList = document.querySelector('#locations');
    const sectionSelect = document.querySelector('#section');
    const form = document.querySelector('#form');
    const submit = document.querySelector('#submit');
    const status = document.querySelector('#status');
    let locations = [];
    const selectedLocation = () => locations.find(location => location.name === locationsInput.value);
    const message = (text, type = '') => { status.textContent = text; status.className = `status ${type}`; };

    fetch('/api/locations').then(response => response.json()).then(data => {
      locations = data;
      locationList.innerHTML = locations.map(location => `<option value="${location.name}">${location.address}</option>`).join('');
    }).catch(() => message('Não foi possível carregar os locais.', 'error'));

    locationsInput.addEventListener('input', () => {
      const location = selectedLocation();
      sectionSelect.disabled = !location;
      sectionSelect.innerHTML = location ? `<option value="">Seção não informada</option>${location.sections.map(section => `<option value="${section}">${section}</option>`).join('')}` : '<option>Escolha primeiro o local</option>';
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const location = selectedLocation();
      if (!location) return message('Selecione um local válido.', 'error');
      submit.disabled = true;
      message('Salvando cadastro…');
      try {
        const response = await fetch('/api/assignments', { method:'POST', headers:{'Content-Type':'application/json','X-Admin-Token':document.querySelector('#adminToken').value}, body:JSON.stringify({ location_name:location.name, section:sectionSelect.value, name:document.querySelector('#name').value, phone:document.querySelector('#phone').value }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Não foi possível salvar o cadastro.');
        form.reset(); sectionSelect.disabled = true; sectionSelect.innerHTML = '<option>Escolha primeiro o local</option>';
        message(data.message, 'success');
      } catch (error) { message(error.message, 'error'); }
      finally { submit.disabled = false; }
    });
  </script>
</body>
</html>
