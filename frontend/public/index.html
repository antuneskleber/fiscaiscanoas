<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173a67">
  <meta name="description" content="Consulta de locais, seções e contatos de fiscais eleitorais em Canoas.">
  <title>Locais, Seções e Fiscais | Canoas</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14223a;
      --muted: #536174;
      --paper: #fff;
      --canvas: #f3f6fa;
      --line: #d9e1ec;
      --brand: #173a67;
      --brand-light: #244a7b;
      --tag: #e8f0fb;
      --ok: #087443;
      --ok-bg: #e6f7ec;
      --ok-border: #a3e0be;
      --warn: #8c5500;
      --warn-bg: #fff8e8;
      --warn-border: #f7d488;
      --wa-bg: #25d366;
      --wa-color: #ffffff;
      --wa-hover: #1ebb5b;
    }
    * { box-sizing: border-box; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 820px; margin: auto; padding: max(20px, env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom)); }
    
    .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .brand-badge { font-size: 0.88rem; font-weight: 800; color: var(--brand); letter-spacing: 0.02em; text-transform: uppercase; }

    header { padding: 0 4px 14px; }
    h1 { margin: 0 0 6px; color: var(--brand); font-size: clamp(1.6rem, 4vw, 2.1rem); letter-spacing: -0.025em; font-weight: 800; }
    header p { margin: 0; color: var(--muted); font-size: 1rem; }

    .search { position: sticky; top: 0; z-index: 10; padding: 10px 0 8px; background: linear-gradient(var(--canvas) 85%, transparent); }
    .search-input-wrap { position: relative; }
    input[type="search"] { width: 100%; min-height: 56px; padding: 14px 44px 14px 18px; border: 2px solid var(--line); border-radius: 14px; outline: 0; background: var(--paper); color: var(--ink); font: inherit; font-size: 16px; box-shadow: 0 2px 10px #14223a0d; }
    input[type="search"]:focus { border-color: var(--brand); box-shadow: 0 0 0 4px #173a6720; }
    .search-clear { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: #e2eaf4; border: 0; border-radius: 50%; width: 28px; height: 28px; font-size: 14px; font-weight: bold; color: var(--brand); cursor: pointer; display: none; align-items: center; justify-content: center; }

    .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 8px 2px 10px; scrollbar-width: none; }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .tab-btn { flex-shrink: 0; padding: 8px 16px; border: 1.5px solid var(--line); border-radius: 20px; background: var(--paper); color: var(--muted); font: inherit; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: all 0.15s ease; }
    .tab-btn:hover { border-color: var(--brand); color: var(--brand); }
    .tab-btn.active { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 2px 8px #173a6730; }

    .meta { min-height: 24px; margin: 2px 4px 12px; color: var(--muted); font-size: 0.92rem; font-weight: 600; }

    .card { margin: 14px 0; padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); box-shadow: 0 2px 8px #14223a0a; transition: box-shadow 0.15s ease; }
    .card:hover { box-shadow: 0 4px 14px #14223a12; }
    
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .title { font-size: 1.15rem; font-weight: 800; line-height: 1.28; color: var(--ink); }
    .zone-badge { flex-shrink: 0; padding: 4px 10px; border-radius: 8px; background: var(--tag); color: var(--brand-light); font-size: 0.8rem; font-weight: 750; }
    
    .details { margin: 8px 0 14px; color: #2e3d52; font-size: 0.95rem; font-weight: 550; display: flex; align-items: center; gap: 6px; }
    .address-text { color: #20334d; font-size: 0.95rem; }
    
    .sections-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 6px; }
    .sections { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 16px; }
    .section { padding: 4px 8px; border-radius: 6px; background: var(--tag); color: var(--brand-light); font-size: 0.82rem; font-weight: 700; }
    .section.hit { background: var(--brand); color: #fff; transform: scale(1.06); }

    /* Bloco dos Fiscais */
    .fiscals-block { padding: 14px; border-radius: 12px; background: #f8fafc; border: 1px solid #e5edf5; }
    .fiscals-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    
    .badge-status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 20px; font-size: 0.82rem; font-weight: 750; }
    .badge-status.assigned { background: var(--ok-bg); border: 1px solid var(--ok-border); color: var(--ok); }
    .badge-status.unassigned { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn); }

    .fiscal-list { display: grid; gap: 8px; margin-top: 10px; }
    .fiscal-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; background: #ffffff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 1px 3px #00000008; }
    @media (max-width: 600px) {
      .fiscal-row { flex-direction: column; align-items: stretch; gap: 10px; }
    }
    
    .fiscal-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .fiscal-avatar { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: #e8f0fb; color: var(--brand); font-size: 1rem; flex-shrink: 0; }
    .fiscal-name-box { min-width: 0; }
    .fiscal-name { font-size: 1rem; font-weight: 750; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fiscal-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .fiscal-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
    .btn-tel, .btn-wa { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 36px; padding: 6px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 750; text-decoration: none; transition: all 0.12s ease; }
    .btn-tel { background: #eef3f8; color: var(--brand); border: 1px solid #ccd8e6; }
    .btn-tel:hover { background: #e1ebf5; }
    .btn-wa { background: var(--wa-bg); color: var(--wa-color); border: 1px solid #1ebb5b; box-shadow: 0 1px 3px #00000015; }
    .btn-wa:hover { background: var(--wa-hover); }
    .no-phone-tag { font-size: 0.8rem; color: var(--muted); font-style: italic; padding: 6px 4px; }

    .empty { padding: 44px 16px; color: var(--muted); text-align: center; font-size: 1rem; background: var(--paper); border-radius: 14px; border: 1px solid var(--line); margin: 20px 0; }
    footer { margin-top: 36px; color: var(--muted); font-size: 0.8rem; text-align: center; }

    @media (max-width: 600px) {
      .wrap { padding-left: 12px; padding-right: 12px; }
      .card { margin: 10px 0; padding: 15px; }
      .search { padding: 8px 0; }
      input[type="search"] { min-height: 52px; font-size: 15px; }
      .btn-tel, .btn-wa { flex: 1; min-height: 40px; }
      .fiscals-header { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <nav class="nav">
      <span class="brand-badge">📍 Eleições Canoas</span>
    </nav>
    <header>
      <h1>Locais e Fiscais Eleitorais</h1>
      <p>Consulte as escolas, seções e os fiscais de cada local com contato direto.</p>
    </header>

    <div class="search">
      <label for="q" class="sr-only">Buscar local, seção ou fiscal</label>
      <div class="search-input-wrap">
        <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Buscar local, bairro, seção ou nome do fiscal..." autofocus>
        <button id="clearSearch" class="search-clear" type="button" aria-label="Limpar busca">✕</button>
      </div>
      <div class="filter-tabs">
        <button type="button" class="tab-btn active" data-filter="all">Todos (<span id="countAll">0</span>)</button>
        <button type="button" class="tab-btn" data-filter="assigned">✓ Com Fiscal (<span id="countAssigned">0</span>)</button>
        <button type="button" class="tab-btn" data-filter="unassigned">⚠️ Sem Fiscal (<span id="countUnassigned">0</span>)</button>
      </div>
    </div>

    <p class="meta" id="meta" aria-live="polite">Carregando dados…</p>
    
    <!-- Lista de locais com fiscais -->
    <section id="results" aria-live="polite"></section>
    
    <footer>Consulta pública v0.4.5 • Developed by AK Labs</footer>
  </main>

  <script>
    const normalize = value => String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    const escapeHtml = value => String(value || '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    
    const input = document.querySelector('#q');
    const clearBtn = document.querySelector('#clearSearch');
    const meta = document.querySelector('#meta');
    const results = document.querySelector('#results');
    const tabBtns = document.querySelectorAll('.tab-btn');

    let rawLocations = [];
    let rawFiscals = [];
    let mappedLocations = [];
    let activeFilter = 'all';

    const formatPhone = value => {
      const digits = String(value || '').replace(/\D/g, '');
      if (digits.length === 11) return `(${digits.slice(0,2)}) ${digits.slice(2,7)}-${digits.slice(7)}`;
      if (digits.length === 10) return `(${digits.slice(0,2)}) ${digits.slice(2,6)}-${digits.slice(6)}`;
      return value || '';
    };

    const getWhatsAppUrl = (phone, fiscalName, locationName) => {
      let digits = String(phone || '').replace(/\D/g, '');
      if (!digits || digits.length < 10) return '';
      if (!digits.startsWith('55')) digits = '55' + digits;
      const msg = `Olá ${fiscalName}, sou da coordenação dos fiscais de Canoas (${locationName}).`;
      return `https://wa.me/${digits}?text=${encodeURIComponent(msg)}`;
    };

    const customMetadata = {
      'escola guarani': { zone: '66', address: 'Rua São Borja, 350 – Harmonia' },
      'escola irmao miguel': { zone: '134', address: 'Rua João Leivas de Carvalho, 461 – São José' },
      'harmonia / luterano': { zone: '66', address: 'Bairro Harmonia – Canoas' },
      'fiscais volantes (harmonia e rio branco)': { zone: '66/134', address: 'Bairros Harmonia e Rio Branco (Fiscalização Volante)' }
    };

    function processData() {
      const locMap = new Map();
      mappedLocations = rawLocations.map(loc => {
        const item = { ...loc, fiscals: [] };
        locMap.set(normalize(loc.name), item);
        return item;
      });

      rawFiscals.forEach(fiscal => {
        const fn = normalize(fiscal.location_name);
        let matched = locMap.get(fn);

        if (!matched) {
          // Busca por correspondência aproximada se tiver ao menos 5 caracteres
          for (const [key, loc] of locMap.entries()) {
            if (fn.length >= 5 && (key.includes(fn) || fn.includes(key))) {
              matched = loc;
              break;
            }
          }
        }

        if (matched) {
          matched.fiscals.push(fiscal);
        } else {
          // Cria o local personalizado diretamente na lista oficial
          const metaInfo = customMetadata[fn] || { zone: 'Canoas', address: fiscal.location_name + ' – Canoas' };
          const newLoc = {
            name: fiscal.location_name.toUpperCase(),
            zone: metaInfo.zone,
            address: metaInfo.address,
            sections: [],
            pages: [],
            fiscals: [fiscal]
          };
          locMap.set(fn, newLoc);
          mappedLocations.unshift(newLoc);
        }
      });

      // Atualiza contadores
      const totalLocs = mappedLocations.length;
      const countAssigned = mappedLocations.filter(l => l.fiscals.length > 0).length;
      const countUnassigned = totalLocs - countAssigned;
      
      document.querySelector('#countAll').textContent = totalLocs;
      document.querySelector('#countAssigned').textContent = countAssigned;
      document.querySelector('#countUnassigned').textContent = countUnassigned;
    }

    function render() {
      const query = input.value.trim();
      clearBtn.style.display = query ? 'flex' : 'none';
      const normQuery = normalize(query);
      const isNumericSection = /^\d+$/.test(query);

      // Filtragem de locais
      let matches = mappedLocations.filter(loc => {
        if (activeFilter === 'assigned' && loc.fiscals.length === 0) return false;
        if (activeFilter === 'unassigned' && loc.fiscals.length > 0) return false;

        if (!normQuery) return true;

        const locMatch = [loc.name, loc.address, loc.zone, ...(loc.sections || []).map(String)]
          .some(v => normalize(v).includes(normQuery));
        if (locMatch) return true;

        // Busca também pelo nome ou telefone dos fiscais dentro do local!
        const fiscalMatch = loc.fiscals.some(f => 
          [f.name, f.phone].some(v => normalize(v).includes(normQuery))
        );
        return fiscalMatch;
      });

      const totalSections = matches.reduce((acc, loc) => acc + (loc.sections ? loc.sections.length : 0), 0);
      const totalFiscais = matches.reduce((acc, loc) => acc + loc.fiscals.length, 0);

      meta.textContent = query || activeFilter !== 'all'
        ? `Exibindo ${matches.length} local(is) • ${totalFiscais} fiscal(is) alocado(s)`
        : `${matches.length} locais de fiscalização • ${totalSections} seções • ${totalFiscais} fiscais escalados`;

      if (!matches.length) {
        results.innerHTML = '<div class="empty">Nenhum local ou fiscal encontrado com este critério de busca.</div>';
        return;
      }

      results.innerHTML = matches.map(loc => {
        const hasFiscals = loc.fiscals.length > 0;
        const hasSections = loc.sections && loc.sections.length > 0;

        return `
          <article class="card">
            <div class="card-top">
              <div class="title">${escapeHtml(loc.name)}</div>
              <span class="zone-badge">${escapeHtml(loc.zone)}ª Zona</span>
            </div>
            <div class="details">
              <span class="address-text">📍 ${escapeHtml(loc.address)}</span>
            </div>

            ${hasSections ? `
              <div class="sections-title">Seções Eleitorais (${loc.sections.length}):</div>
              <div class="sections">
                ${loc.sections.map(s => `
                  <span class="section ${isNumericSection && s === Number(query) ? 'hit' : ''}">${s}</span>
                `).join('')}
              </div>
            ` : ''}

            <div class="fiscals-block">
              <div class="fiscals-header">
                ${hasFiscals 
                  ? `<span class="badge-status assigned">✓ ${loc.fiscals.length} fiscal(is) escalado(s)</span>`
                  : `<span class="badge-status unassigned">⚠️ Sem fiscal alocado</span>`
                }
              </div>

              ${hasFiscals ? `
                <div class="fiscal-list">
                  ${loc.fiscals.map(f => {
                    const phoneFmt = formatPhone(f.phone);
                    const digits = String(f.phone || '').replace(/\D/g, '');
                    const waUrl = getWhatsAppUrl(f.phone, f.name, loc.name);
                    const sectionText = f.section ? `Seção ${f.section}` : 'Fiscal de Local (Geral)';
                    
                    return `
                      <div class="fiscal-row">
                        <div class="fiscal-id">
                          <div class="fiscal-avatar">👤</div>
                          <div class="fiscal-name-box">
                            <div class="fiscal-name">${escapeHtml(f.name)}</div>
                            <div class="fiscal-meta">${sectionText}</div>
                          </div>
                        </div>
                        <div class="fiscal-actions">
                          ${digits ? `<a href="tel:${digits}" class="btn-tel" title="Ligar para ${escapeHtml(f.name)}">📞 ${escapeHtml(phoneFmt)}</a>` : ''}
                          ${waUrl ? `<a href="${waUrl}" target="_blank" rel="noopener" class="btn-wa" title="Chamar no WhatsApp">💬 WhatsApp</a>` : ''}
                          ${!digits ? `<span class="no-phone-tag">Sem telefone cadastrado</span>` : ''}
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              ` : ''}
            </div>
          </article>
        `;
      }).join('');
    }

    input.addEventListener('input', render);
    
    clearBtn.addEventListener('click', () => {
      input.value = '';
      input.focus();
      render();
    });

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        render();
      });
    });

    Promise.all([
      fetch('/api/locations').then(r => r.ok ? r.json() : Promise.reject(new Error('Erro locais'))),
      fetch('/api/fiscals').then(r => r.ok ? r.json() : Promise.reject(new Error('Erro fiscais')))
    ])
    .then(([locationsData, fiscalsData]) => {
      rawLocations = locationsData;
      rawFiscals = fiscalsData;
      processData();
      render();
    })
    .catch(err => {
      meta.textContent = 'Não foi possível carregar os dados. Verifique a conexão.';
    });
  </script>
</body>
</html>
